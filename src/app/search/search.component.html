<div class="input">
  <img class="input__icon" alt="search icon" src="icon-search.svg" />
  <input
    class="input__field"
    type="text"
    [class.input__field--error]="hasError()"
    placeholder="Search GitHub username…"
    [(ngModel)]="value" />
</div>

<div class="action">
  @if (hasError()) {
    <span class="action__error">No results</span>
  }
  <button class="action__button" (click)="onClick()">Search</button>
</div>
